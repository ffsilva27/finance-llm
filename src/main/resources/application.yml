spring:
  datasource:
      url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
      username: sa
      password:
      driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
  application:
    name: llm
  ai:
    openai:
      base-url: http://localhost:11434/v1
      api-key: ollama
      chat:
        options:
          model: llama3.2:latest
    open-router:
      base-url: https://openrouter.ai/api/v1
      api-key: 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
      model: openrouter/owl-alpha

telegram:
  token: token_telegram
  url: https://api.telegram.org/bot
